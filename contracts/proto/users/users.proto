syntax = "proto3";

package users;

option go_package = "io.github.moughamir/amudia/gen/go/users";
option java_package = "io.github.moughamir.amudia.users";
option csharp_namespace = "Amudia.Users";

import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
  string avatar_url = 5;
  string subscription_tier = 6;
  google.protobuf.Timestamp created_at = 7;
}
