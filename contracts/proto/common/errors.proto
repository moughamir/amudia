syntax = "proto3";

package common;

option go_package = "io.github.moughamir/amudia/gen/go/common";
option java_package = "io.github.moughamir.amudia.common";
option csharp_namespace = "Amudia.Common";

enum ErrorCode {
  UNKNOWN = 0;
  NOT_FOUND = 1;
  VALIDATION = 2;
  FORBIDDEN = 3;
  UNAUTHORIZED = 4;
  CONFLICT = 5;
  RATE_LIMITED = 6;
  INTERNAL = 7;
}
