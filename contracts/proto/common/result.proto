syntax = "proto3";

package common;

option go_package = "io.github.moughamir/amudia/gen/go/common";
option java_package = "io.github.moughamir.amudia.common";
option csharp_namespace = "Amudia.Common";

import "common/errors.proto";

message Error {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message ResultMeta {
  bool success = 1;
  Error error = 2;
}
