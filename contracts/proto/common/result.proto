syntax = "proto3";

package common;

option go_package = "media/contracts/gen/go/common";
option java_package = "com.media.contracts.common";
option csharp_namespace = "Media.Contracts.Common";

import "common/errors.proto";

message Error {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message ResultMeta {
  bool success = 1;
  Error error = 2;
}
