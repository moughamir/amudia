syntax = "proto3";

package common;

option go_package = "io.github.moughamir/amudia/gen/go/common";
option java_package = "io.github.moughamir.amudia.common";
option csharp_namespace = "Amudia.Common";

message PageRequest {
  uint32 limit = 1;
  string cursor = 2;
}

message PageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}

message PageResponse {
  PageInfo page = 1;
}
