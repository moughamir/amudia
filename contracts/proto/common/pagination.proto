syntax = "proto3";

package common;

option go_package = "media/contracts/gen/go/common";
option java_package = "com.media.contracts.common";
option csharp_namespace = "Media.Contracts.Common";

message PageRequest {
  uint32 limit = 1;
  string cursor = 2;
}

message PageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}

message PageResponse {
  PageInfo page = 1;
}
