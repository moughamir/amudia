syntax = "proto3";

package events;

option go_package = "io.github.moughamir/amudia/gen/go/events";
option java_package = "io.github.moughamir.amudia.events";
option csharp_namespace = "Amudia.Events";

message PlaybackStarted {
  string user_id = 1;
  string media_id = 2;
  string session_id = 3;
}
